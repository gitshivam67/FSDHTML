<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="amazonstyle.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <div class="logo">
                <img src="./image/logo.png" alt="Amazon Logo" height="85" width="70">
            </div>
            <div class="location">Your Location</div>
            <div class="search-bar">
                <input type="text" placeholder="Search for items">
            </div>
            <div class="user">Hello, Shivam</div>
            <div class="returns">Returns & Orders</div>
            <div class="cart">Cart</div>
        </div>

        <!-- Wallpaper Section -->
        <div class="wallpaper">
            <img class="photo" src="./FDFO_PC.gif" alt="Wallpaper" height="500" width="100%">
        </div>

        <!-- Navbar Section -->
        <div class="navbar">
            <ul>
                <li>Home & Kitchen</li>
                <li>Keep Shopping For</li>
                <li>Today's Deals</li>
                <li>Electronics</li>
                <li>Prime</li>
                <li>Buy Again</li>
                <li>MX Player</li>
            </ul>
        </div>
       
        <!-- Cards Section -->
        <div class="cards">
            <div class="card">a</div>
            <div class="card">b</div>
            <div class="card">c</div>
            <div class="card">d</div>
        </div>
    </div>
</body>
</html>
